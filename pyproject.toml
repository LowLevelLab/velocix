[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velocix"
version = "0.1.3"
description = "A learning project - ASGI web framework built to understand async Python patterns"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Magi Sharma", email = "sharmamagio0@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
]
dependencies = [
    "granian>=1.0.0",
    "orjson>=3.9.0",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "itsdangerous>=2.0.0",
    "nh3>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/magi8101/velocix"
Repository = "https://github.com/magi8101/velocix"
Issues = "https://github.com/magi8101/velocix/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "ruff>=0.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "types-aiofiles>=23.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by formatting, not worth failing CI over.
# B008: Depends()/Query()/Header() etc. as default-arg values is velocix's
# own FastAPI-style DI pattern, used throughout its public API — not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

# yaml (openapi/models.py, generator.py) and redis (security/base.py's
# RedisBackend) are both genuinely optional, try/except-ImportError-guarded
# integrations, not real requirements — not installed by default, so no
# blanket ignore_missing_imports for the whole codebase.
[[tool.mypy.overrides]]
module = ["yaml", "redis", "redis.*"]
ignore_missing_imports = true
